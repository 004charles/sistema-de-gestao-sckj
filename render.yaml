build_command: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
start_command: "cd backend && gunicorn projeto.wsgi:application"
env_vars:
  - key: DEBUG
    value: "False"
  - key: SECRET_KEY
    generateValue: true
  - key: ALLOWED_HOSTS
    value: ".onrender.com"
  - key: CORS_ALLOWED_ORIGINS
    value: "https://*.vercel.app,http://localhost:3000"
