version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sckj_reconciliacao_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconciliacao_db}
      POSTGRES_USER: ${POSTGRES_USER:-reconciliacao_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconciliacao_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconciliacao_user} -d ${POSTGRES_DB:-reconciliacao_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sckj_reconciliacao_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-angola-fiscal-2026}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-reconciliacao_user}:${POSTGRES_PASSWORD:-reconciliacao_secure_password_2026}@db:5432/${POSTGRES_DB:-reconciliacao_db}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sckj_reconciliacao_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - media_volume:/app/media:ro

volumes:
  postgres_data:
  static_volume:
  media_volume:
